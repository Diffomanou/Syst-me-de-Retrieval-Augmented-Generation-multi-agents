# .github/workflows/ci.yml
# ══════════════════════════════════════════════════════════════════════
# Pipeline CI/CD — Multi-Agent RAG System
#
# Déclenchement :
#   - push sur main ou develop
#   - pull request vers main
#
# Étapes :
#   1. lint    : vérification du style de code (flake8)
#   2. test    : exécution des tests unitaires (pytest)
#   3. build   : construction de l'image Docker
#   4. deploy  : déploiement (uniquement sur push → main)
# ══════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: multi-agent-rag

jobs:

  # ── Job 1 : Lint ───────────────────────────────────────────────────
  lint:
    name: Vérification du code (Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Installation des dépendances de lint
        run: pip install flake8 black isort

      - name: Vérification du formatage (black)
        run: black --check --diff .
        continue-on-error: true  # Avertissement seulement

      - name: Vérification des imports (isort)
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Analyse statique (flake8)
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=.git,__pycache__,.venv,chroma_db \
            --ignore=E501,W503

  # ── Job 2 : Tests ─────────────────────────────────────────────────
  test:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Création du fichier .env de test
        run: |
          cat > .env << EOF
          OPENAI_API_KEY=sk-test-key-for-ci
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=password123
          APP_ENV=test
          LLM_MODEL=gpt-4o-mini
          EMBEDDING_MODEL=text-embedding-3-small
          CHROMA_PERSIST_DIR=./chroma_db_test
          CHROMA_COLLECTION_NAME=test_collection
          EOF

      - name: Exécution des tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --ignore=tests/test_integration.py
        env:
          OPENAI_API_KEY: sk-test-ci-key

      - name: Upload du rapport de couverture
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Job 3 : Build Docker ───────────────────────────────────────────
  build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérification de l'image
        run: |
          echo "Image construite avec succès : ${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ── Job 4 : Deploy (main uniquement) ──────────────────────────────
  deploy:
    name: Déploiement (main seulement)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Simulation du déploiement
        run: |
          echo "✅ Pipeline CI/CD terminé avec succès !"
          echo "Commit : ${{ github.sha }}"
          echo "Branche : ${{ github.ref_name }}"
          echo ""
          echo "Pour un vrai déploiement, remplace cette étape par :"
          echo "  - docker push vers un registry (Docker Hub, GHCR, ECR)"
          echo "  - déploiement sur Railway, Render, ou un VPS"
