version: "3.9"

# ══════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Multi-Agent RAG System
#
# Services :
#   neo4j : base de données graphe (port 7474 = interface web, 7687 = bolt)
#   app   : l'API FastAPI (port 8000)
#
# Lancement : docker-compose up --build
# ══════════════════════════════════════════════════════════════════════════

services:

  # ── Neo4j ────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26.0-community
    container_name: rag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Interface web Neo4j Browser
      - "7687:7687"   # Protocole Bolt (connexion Python)
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Application FastAPI ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Remplaces par tes valeurs (ou utilise un fichier .env)
      GROQ_API_KEY: ${GROQ_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      APP_ENV: production
      LOG_LEVEL: INFO
      LLM_MODEL: llama-3.1-8b-instant
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      CHROMA_PERSIST_DIR: /app/chroma_db
      CHROMA_COLLECTION_NAME: documents
    volumes:
      - chroma_data:/app/chroma_db  # Persistance des embeddings ChromaDB
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Volumes persistants ───────────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  chroma_data:
